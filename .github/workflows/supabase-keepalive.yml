name: Supabase Keep-Alive Ping

# Supabase pauses free projects after 7 days without activity. This reads from the
# database twice a day so that never happens. (A Vercel cron job in vercel.json does
# the same once a day as a backup, in case GitHub ever disables this schedule.)
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's publishable/anon key
# Never put the key in this file: the repository is public.

on:
  schedule:
    - cron: '17 3,15 * * *' # 03:17 and 15:17 UTC
  workflow_dispatch: # manual run from the Actions tab

jobs:
  keepalive:
    name: Prevent inactivity pause
    runs-on: ubuntu-latest
    steps:
      - name: Read from the Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          URL="${SUPABASE_URL%/}"
          for attempt in 1 2 3; do
            DB=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/settings?select=key&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Attempt $attempt: database responded HTTP $DB"
            if [ "$DB" -ge 200 ] && [ "$DB" -lt 300 ]; then
              echo "Supabase is active; inactivity timer reset."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Supabase did not respond. Check that the project is not paused."
          exit 1
