# One-click demo deployment on Render (https://render.com)
# Free plan: the disk is temporary, so demo data resets whenever the
# service restarts or sleeps. The admin / admin123 login is recreated each time.
services:
  - type: web
    name: penta-kedarnath-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/demo
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DEMO_MODE
        value: "true"
